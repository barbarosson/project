# SitePulse — dedicated Netlify site only.
# In Netlify UI set Base directory = visitor-analytics (do NOT reuse moduluscursor / isendai sites).
# Do not set [build].base here — UI base already cds into this folder.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Prisma generate runs via npm run build / postinstall; no DB needed at build time.

[[plugins]]
  package = "@netlify/plugin-nextjs"
