<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1F26"/>
      <stop offset="100%" stop-color="#14161A"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="44" fill="url(#bg)" stroke="#4C8DFF" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Shifted 10% left so head + waves sit in the optical center -->
