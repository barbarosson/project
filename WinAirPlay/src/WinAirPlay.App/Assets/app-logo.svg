        d="M97 77 C112 77 117 87 117 97
           C117 105 122 110 128 115
           C135 118 135 123 128 125
           C122 128 130 131 130 136
           C122 141 117 148 112 159
           C97 169 76 164 66 148
           C71 102 81 77 97 77 Z"/>
  <!-- Neck -->
  <path fill="#3DD68C"
        d="M66 154 C61 174 61 189 66 195
           C81 200 97 195 102 184
           C102 169 97 159 87 154
           C76 148 71 148 66 154 Z"/>
  <ellipse cx="98" cy="104" rx="7" ry="6" fill="#14161A"/>

  <!-- Sound waves from mouth -->
  <path d="M128 116 A30 48 0 0 1 128 156" stroke="#3DD68C" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M142 102 A44 64 0 0 1 142 170" stroke="#3DD68C" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.82"/>
