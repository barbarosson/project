  <ellipse cx="82" cy="118" rx="44" ry="54" fill="#3DD68C"/>
  <!-- Ear -->
  <ellipse cx="54" cy="124" rx="12" ry="17" fill="#3DD68C"/>
  <!-- Face: forehead, nose, lips, chin -->
