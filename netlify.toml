# Two Netlify sites, same repo — see docs/deploy-model-b.md
# Set Base directory in the Netlify UI (netlify.toml must NOT pin base here):
#   - isendai production / staging → Base directory: ai-suite
#   - moduluscursor (modulusaas.com) → Base directory: .  (repo root)

[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--legacy-peer-deps"
NEXT_TELEMETRY_DISABLED = "1"
NETLIFY_NEXT_PLUGIN_SKIP = "false"
NODE_OPTIONS = "--max-old-space-size=4096"

[dev]
command = "npm run dev"
port = 3000

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/static/*"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[plugins]]
package = "@netlify/plugin-nextjs"