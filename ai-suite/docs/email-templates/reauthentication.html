<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>Verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#09090b;-webkit-font-smoothing:antialiased;">
  <div style="display:none;max-height:0;overflow:hidden;">Your isendai verification code — enter it to continue.</div>
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#09090b;">
    <tr>
      <td align="center" style="padding:32px 16px 48px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;border-collapse:separate;">
          <tr>
            <td style="height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);line-height:3px;font-size:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="background-color:#121214;border:1px solid rgba(255,255,255,0.08);border-top:none;border-radius:0 0 16px 16px;padding:32px 28px 28px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
              <p style="margin:0 0 8px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#a78bfa;">isendai</p>
              <h1 style="margin:0 0 16px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:600;line-height:1.25;color:#fafafa;">Verification code</h1>
              <p style="margin:0 0 24px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#a1a1aa;">Enter this code where prompted to continue as <strong style="color:#e4e4e7;">{{ .Email }}</strong>. It expires shortly.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding:16px 20px;background-color:rgba(139,92,246,0.12);border:1px solid rgba(167,139,250,0.35);border-radius:14px;">
                    <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:0.35em;color:#fafafa;">{{ .Token }}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#71717a;">Prefer a link? <a href="{{ .ConfirmationURL }}" style="color:#a78bfa;text-decoration:none;">Continue here</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 8px 0;text-align:center;">
              <p style="margin:0 0 8px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#52525b;">AI Suite for everyday communication</p>
              <a href="{{ .SiteURL }}" style="font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#a78bfa;text-decoration:none;">Open isendai</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
